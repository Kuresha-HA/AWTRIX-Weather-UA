mode: restart

variables:
  device_ids: !input awtrix
  app_topic: KU_Weather

  # Один запис для кожного пристрою: {fw, weather topic, sun topic}.
  #   AWTRIX NG  -> <mqtt_prefix>/cmd/apps/pushed/<app>   (виявляється сенсором "MQTT prefix")
  #   AWTRIX 3   -> <device_topic>/custom/<app>           (виявляється сенсором "device_topic")
  topics: >-
    {%- set ns = namespace(devices=[]) -%}
    {%- for device_id in device_ids -%}
      {%- set ents = device_entities(device_id) | list -%}
      {%- set ng_ents = ents | select('search','mqtt_prefix') | list -%}
      {%- set old_ents = ents | select('search','device_topic') | list -%}
      {%- if ng_ents | length > 0 -%}
        {%- set pfx = states(ng_ents[0]) | string | trim -%}
        {%- if pfx and pfx not in ['unknown','unavailable','none'] -%}
          {%- set ns.devices = ns.devices + [{'fw': 'ng', 'weather': pfx ~ '/cmd/apps/pushed/' ~ app_topic, 'sun': pfx ~ '/cmd/apps/pushed/' ~ app_topic ~ '_sun'}] -%}
        {%- endif -%}
      {%- elif old_ents | length > 0 -%}
        {%- set pfx = states(old_ents[0]) | string | trim -%}
        {%- if pfx and pfx not in ['unknown','unavailable','none'] -%}
          {%- set ns.devices = ns.devices + [{'fw': 'old', 'weather': pfx ~ '/custom/' ~ app_topic, 'sun': pfx ~ '/custom/' ~ app_topic ~ '_sun'}] -%}
        {%- endif -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.devices }}

  forecast_var: !input forecast_var
  current_condition: "{{ states(forecast_var) }}"
  current_temp: "{{ state_attr(forecast_var,'temperature') }}"

  hours_to_show: !input hours_to_show

  moon: !input moon
  moon_phase: "{{ states(moon) }}"
  moon_times: !input moon_rise_set
  moon_rise: "{{ state_attr(moon_times,'moonrise') }}"
  moon_set: "{{ state_attr(moon_times,'moonset') }}"
  moon_alt: "{{ state_attr(moon_times,'moon_altitude') }}"
  moon_risen: "{{ moon_alt > 0 }}"
  when_show_moon: !input when_show_moon
  show_moon: >-
    {%- if when_show_moon == 'always' %} True
    {%- elif when_show_moon == 'never' %} False
    {%- elif when_show_moon == 'risen' %} {{ moon_risen }}
    {%- else %} {{ state_attr('sun.sun','elevation') < 0 and moon_risen }}
    {%- endif %}

  message_duration: !input message_duration_forecast
  message_duration_riseset: !input message_duration_riseset

  current_temp_var: !input current_temp_var
  temp_digits: !input temp_digits
  temp_suffix: !input temp_suffix
  temp_text: >-
    {%- macro round_and_set_temp(temp_var, temp_suffix, digits=0) -%}
      {%- if has_value(temp_var) -%}
        {{ states(temp_var) | round(digits) ~ temp_suffix }}
      {%- elif current_temp is number -%}
        {{ current_temp | round(digits) ~ temp_suffix }}
      {%- else -%}
        {{ "" }}
      {%- endif -%}
    {%- endmacro -%}
    {{ round_and_set_temp(current_temp_var, temp_suffix, temp_digits) }}

  text_available_width: "{%- if show_moon %}16{%- else %}24{%- endif %}"
  text_len: >-
    {%- macro get_text_len(string) -%}
      {%- set length = namespace(value=0) -%}
      {%- for char in string -%}
        {%- if char.isdigit() -%}{%- set length.value = length.value + 3 -%}
        {%- elif char == '°' -%}{%- set length.value = length.value + 2 -%}
        {%- elif char == '.' -%}{%- set length.value = length.value + 1 -%}
        {%- elif char in ['-','C','F'] -%}{%- set length.value = length.value + 3 -%}
        {%- else -%}{%- set length.value = length.value + 1 -%}
        {%- endif -%}
        {%- if not loop.last -%}{%- set length.value = length.value + 1 -%}{%- endif -%}
      {%- endfor -%}
      {{ length.value }}
    {%- endmacro -%}
    {{ get_text_len(temp_text | string) }}
  text_x: "{{ (8 + ((text_available_width - text_len) / 2)) | int }}"

  sun_event_minute_threshold: !input sun_event_minute_threshold
  sun_time_type: !input sun_time_type
  sun_time_format: !input sun_time_format
  icon_sunrise: !input icon_sunrise
  icon_sunset: !input icon_sunset
  show_sun_rise_set: !input show_sun_rise_set

  sun_next_event: >-
    {%- set rise = state_attr('sun.sun','next_rising') -%}
    {%- set set  = state_attr('sun.sun','next_setting') -%}
    {%- set ts_rise = rise | as_timestamp -%}
    {%- set ts_set  = set  | as_timestamp -%}
    {{ iif(ts_set < ts_rise,'sunset','sunrise') }}

  sun_min_until_next_event: >-
    {%- set rise = state_attr('sun.sun','next_rising') -%}
    {%- set set  = state_attr('sun.sun','next_setting') -%}
    {%- set ts_rise = rise | as_timestamp -%}
    {%- set ts_set  = set  | as_timestamp -%}
    {{ iif(sun_next_event == 'sunrise',(ts_rise - utcnow()|as_timestamp) / 60,(ts_set - utcnow()|as_timestamp) / 60) | round(0) }}

  # AWTRIX 3 text (string OR fragment array with t/c keys)
  sun_next_str: >-
    {%- set rise = state_attr('sun.sun','next_rising') -%}
    {%- set set  = state_attr('sun.sun','next_setting') -%}
    {%- set ts_rise = rise | as_timestamp -%}
    {%- set ts_set  = set  | as_timestamp -%}
    {%- if sun_time_type == 'Actual' -%}
      {{ iif(sun_next_event == 'sunrise',
             (ts_rise | as_datetime | as_local).strftime(sun_time_format),
             (ts_set  | as_datetime | as_local).strftime(sun_time_format)) }}
    {%- else -%}
      {%- set hours = sun_min_until_next_event // 60 -%}
      {%- set remaining_minutes = sun_min_until_next_event % 60 -%}
      {%- if hours == 0 -%}
        {{ remaining_minutes }} min
      {%- else -%}
        [
          {"t":"{{hours}}","c":"#ffffff"},
          {"t":"h","c":"#9c9d97"},
          {"t":"{{remaining_minutes}}","c":"#ffffff"},
          {"t":"m","c":"#9c9d97"}
        ]
      {%- endif -%}
    {%- endif -%}

  # Текст AWTRIX NG: завжди JSON рядок або масив фрагментів з ключами text/color.
  # NG тихо ігнорує числовий "text", тому значення стилю "%H%M" ("1245") змушено перетворюються у рядки.
  sun_text_ng: >-
    {%- if sun_time_type == 'Actual' -%}
      {{ sun_next_str | string | tojson }}
    {%- else -%}
      {%- set h = (sun_min_until_next_event | int) // 60 -%}
      {%- set m = (sun_min_until_next_event | int) % 60 -%}
      {%- if h == 0 -%}
        "{{ m }} min"
      {%- else -%}
        [{"text":"{{ h }}","color":"#ffffff"},{"text":"h","color":"#9c9d97"},{"text":"{{ m }}","color":"#ffffff"},{"text":"m","color":"#9c9d97"}]
      {%- endif -%}
    {%- endif -%}

  sun_event_icon: "{{ iif(sun_next_event == 'sunrise', icon_sunrise, icon_sunset) }}"

  # AWTRIX 3 payload
  sun_event_payload: '{"icon":"{{sun_event_icon}}","text": {{ sun_next_str | tojson }},"duration": {{message_duration_riseset}}}'
  sun_payload: >-
    {%- if show_sun_rise_set %} {{ iif(sun_event_minute_threshold >= sun_min_until_next_event, sun_event_payload, "{}") }} {%- else %} {} {%- endif %}

  # AWTRIX NG payload. "{}" (точно) видаляє додаток через MQTT.
  sun_payload_ng: >-
    {%- if show_sun_rise_set and sun_event_minute_threshold >= sun_min_until_next_event -%}
      {"icon":"{{ sun_event_icon }}","text": {{ sun_text_ng }},"durationMs": {{ (message_duration_riseset | int) * 1000 }},"lifetimeMs": 120000}
    {%- else -%}
      {}
    {%- endif -%}

  icon_clear_night: !input icon_clear_night
  use_moon_clear_night: !input use_moon_clear_night
  use_moon_sunny_night: !input use_moon_sunny_night
  icon_cloudy: !input icon_cloudy
  icon_exceptional: !input icon_exceptional
  icon_fog: !input icon_fog
  icon_hail: !input icon_hail
  icon_lightning: !input icon_lightning
  icon_lightning_rainy: !input icon_lightning_rainy
  icon_partlycloudy: !input icon_partlycloudy
  icon_pouring: !input icon_pouring
  icon_rainy: !input icon_rainy
  icon_snowy: !input icon_snowy
  icon_snowy_rainy: !input icon_snowy_rainy
  icon_sunny: !input icon_sunny
  icon_windy: !input icon_windy
  icon_windy_variant: !input icon_windy_variant

  color_matrix_json: !input color_matrix_json
  color_dict: >-
    {% set b = color_matrix_json | from_json %}
    {%- set ns = namespace(tuples=[]) -%}
    {%- for k,v in b.items() -%}
      {%- set key = k|float -%}
      {%- set ns.tuples = ns.tuples + [(key,v)] -%}
    {%- endfor -%}
    {{ dict.from_keys(ns.tuples) }}

  icon_dict: >-
    {{ dict({
      'clear-night': icon_clear_night,
      'cloudy': icon_cloudy,
      'exceptional': icon_exceptional,
      'fog': icon_fog,
      'hail': icon_hail,
      'lightning': icon_lightning,
      'lightning-rainy': icon_lightning_rainy,
      'partlycloudy': icon_partlycloudy,
      'pouring': icon_pouring,
      'rainy': icon_rainy,
      'snowy': icon_snowy,
      'snowy-rainy': icon_snowy_rainy,
      'sunny': icon_sunny,
      'windy': icon_windy,
      'windy-variant': icon_windy_variant
    }) }}

  # Іконка погоди для поточного стану. Заміна на місяць робиться не тут, а у payload
  # (shown_icon): коли місяць малюється замість іконки, іконка стає порожньою.
  icon: >-
    {{ icon_dict.get(current_condition, icon_exceptional) }}

  # True коли місяць малюється над слотом іконки (x=0) замість місця праворуч (x=23)
  moon_replaces_icon: >-
    {{ (current_condition == 'clear-night' and use_moon_clear_night) or ((sun_next_event == 'sunrise') and use_moon_sunny_night and (current_condition == 'sunny')) }}
  moon_x: "{{ 0 if moon_replaces_icon else 23 }}"

  # Бітмап місяця 8x8 (запаковані RGB числа). Ті самі піксельні дані для обох прошивок,
  # відрізняється лише обгортка: AWTRIX 3 -> {"db":[x,y,w,h,[..]]}   AWTRIX NG -> ["bitmap",x,y,w,h,[..]]
