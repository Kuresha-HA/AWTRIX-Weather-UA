    } -%}
    {{ d.get(moon_phase, d['new_moon']) }}


trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: state
    entity_id: !input forecast_var
    id: Changes
    enabled: true

condition: []

action:
  - action: weather.get_forecasts
    target:
      entity_id: "{{ forecast_var }}"
    data:
      type: hourly
    response_variable: forecast_response

  - repeat:
      for_each: "{{ topics }}"
      sequence:
        - action: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: "{{ repeat.item.weather }}"
            payload: >-
              {%- set forecast = forecast_response[forecast_var]['forecast'] or [] -%}
              {%- set hours = [hours_to_show | int(0), (forecast | length)] | min -%}
              {%- set ng = (repeat.item.fw == 'ng') -%}
              {%- macro interpolate(dictionary, x) -%}
                {%- set sorted_keys = dictionary|dictsort -%}
                {%- set above = sorted_keys|selectattr('0','ge',x)|map(attribute='0')|list|first -%}
                {%- set below = sorted_keys|selectattr('0','le',x)|map(attribute='0')|list|last  -%}
                {%- if above is defined and above == x -%}{{ dictionary[above] }}
                {%- elif below is defined and below == x -%}{{ dictionary[below] }}
                {%- elif below is defined and above is defined -%}
                  {%- set lv = dictionary[below] -%}{%- set uv = dictionary[above] -%}
                  {%- set lr = lv[1:3]|int(base=16) -%}{%- set lg = lv[3:5]|int(base=16) -%}{%- set lb = lv[5:7]|int(base=16) -%}
                  {%- set ur = uv[1:3]|int(base=16) -%}{%- set ug = uv[3:5]|int(base=16) -%}{%- set ub = uv[5:7]|int(base=16) -%}
                  {%- set t = (x - below) / (above - below) -%}
                  {%- set r = ((1-t)*lr + t*ur)|int -%}{%- set g = ((1-t)*lg + t*ug)|int -%}{%- set b = ((1-t)*lb + t*ub)|int -%}
                  {{ '#' ~ '%02X' % r ~ '%02X' % g ~ '%02X' % b }}
                {%- elif below is defined -%}{{ dictionary[below] }}
                {%- elif above is defined -%}{{ dictionary[above] }}
                {%- else -%}#FFFFFF
                {%- endif -%}
              {%- endmacro -%}

              {#- Елементи малювання збираються в список і об'єднуються, тому JSON залишається валідним
                  навіть якщо годин прогнозу 0 або температура порожня. -#}
              {%- set ns = namespace(items=[]) -%}
              {%- for i in range(hours) -%}
                {%- set p = forecast[i] -%}
                {%- set val = (p.temperature if 'temperature' in p else p.get('feels_like', 0)) | float(0) -%}
                {%- set col = interpolate(color_dict, val) | trim -%}
                {%- if ng -%}
                  {%- set ns.items = ns.items + ['["pixel",' ~ (8 + i) ~ ',7,"' ~ col ~ '"]'] -%}
                {%- else -%}
                  {%- set ns.items = ns.items + ['{"dp":[' ~ (8 + i) ~ ',7,"' ~ col ~ '"]}'] -%}
                {%- endif -%}
              {%- endfor -%}

              {%- set tc = temp_text | string -%}
              {%- if tc | length > 0 -%}
                {%- set tcol = interpolate(color_dict, (states(current_temp_var) | float(default=state_attr(forecast_var,'temperature') | float(0)))) | trim -%}
                {%- if ng -%}
                  {%- set ns.items = ns.items + ['["text",' ~ text_x ~ ',1,"' ~ tc ~ '","' ~ tcol ~ '"]'] -%}
                {%- else -%}
                  {%- set ns.items = ns.items + ['{"dt":[' ~ text_x ~ ',1,"' ~ tc ~ '","' ~ tcol ~ '"]}'] -%}
                {%- endif -%}
              {%- endif -%}

              {%- if show_moon -%}
                {%- if ng -%}
                  {%- set ns.items = ns.items + ['["bitmap",' ~ moon_x ~ ',0,8,8,' ~ moon_pixels ~ ']'] -%}
                {%- else -%}
                  {%- set ns.items = ns.items + ['{"db":[' ~ moon_x ~ ',0,8,8,' ~ moon_pixels ~ ']}'] -%}
                {%- endif -%}
              {%- endif -%}

              {#- Коли місяць замінює іконку, слот іконки порожній (NG малює іконку поверх draw). -#}
              {%- set shown_icon = '' if (show_moon and moon_replaces_icon) else icon -%}
              {%- if ng -%}
              {
                "draw":[{{ ns.items | join(',') }}],
                "icon":"{{ shown_icon }}",
                "durationMs": {{ (message_duration | int) * 1000 }},
                "lifetimeMs": 120000
              }
              {%- else -%}
              {
                "draw":[{{ ns.items | join(',') }}],
                "icon":"{{ shown_icon }}",
                "duration": {{ message_duration }},
                "pushIcon": 2,
                "lifetime": 120,
                "lifetimeMode": 1,
                "weather":"{{ current_condition }}"
              }
              {%- endif -%}

        - action: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: "{{ repeat.item.sun }}"
            payload: "{{ sun_payload_ng if repeat.item.fw == 'ng' else sun_payload }}"