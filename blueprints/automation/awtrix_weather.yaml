      name: Іконка для граду (hail)
      description: "Це ID іконки, яка відповідає стану погоди: `hail` (ЯКЩО У ВАС Є КРАЩА, БУДЬ ЛАСКА, ПОВІДОМТЕ МЕНІ)

![](https://developer.lametric.com/content/apps/icon_thumbs/53385_icon_thumb.gif?v=1)
