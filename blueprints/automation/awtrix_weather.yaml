blueprint:
  name: "AWTRIX Погода ⛈️ + Прогноз + 🌕️ (AWTRIX 3 & NG)"
  description: >
    Цей блюпринт призначений для створення комплексної інформаційної панелі про погоду на дисплеях AWTRIX, яка включає поточний стан, погодинний прогноз та відображення фаз місяця. 

    Він повністю сумісний із прошивками AWTRIX 3 (0.98) та AWTRIX NG. Тип прошивки визначається автоматично для кожного дисплея (AWTRIX NG використовує сенсор `MQTT prefix`, AWTRIX 3 — `device_topic`), що дозволяє об'єднувати пристрої обох типів у межах однієї автоматизації.

    Як джерело даних можна використовувати персональні метеостанції або публічні сервіси (наприклад, OpenWeather), за умови надання ними сумісного погодинного прогнозу погоди.

    Блюпринт автоматично створює та публікує два користувацькі додатки на пристрої:
    - `KU_Weather`: відображає основний звіт про погоду та прогноз.
    - `KU_Weather_sun`: відображає сповіщення про наближення сходу або заходу сонця.

    Маршрутизація повідомлень:
    - Для AWTRIX 3: `<prefix>/custom/<app>`
    - Для AWTRIX NG: `<mqtt prefix>/cmd/apps/pushed/<app>`

    Зверніть увагу: для коректної роботи усі необхідні іконки мають бути заздалегідь завантажені на кожен пристрій AWTRIX.

    ## ⚠️ ОБОВ'ЯЗКОВІ ВИМОГИ ⚠️

    Для функціонування цього блюпринта необхідно виконати наступні попередні налаштування у Home Assistant:

    ### 1. Інтеграція Moon (Місяць)
    Базова інтеграція Moon є обов'язковою для визначення поточних фаз місяця. Ви можете додати її через офіційну документацію [Moon](https://www.home-assistant.io/integrations/moon/) або автоматично, [натиснувши тут](https://my.home-assistant.io/redirect/config_flow_start?domain=moon).

    ### 2. Сенсор сходу/заходу місяця
    Оскільки базова інтеграція Home Assistant не розраховує час сходу та заходу місяця, ці дані необхідно отримувати через зовнішній API, наприклад, [ipgeolocation](https://app.ipgeolocation.io).

    Для налаштування необхідно зареєструвати обліковий запис, отримати `API_KEY` та вказати ваші координати (`LAT` — широта, `LON` — довгота). Після цього додайте наступний [REST-сенсор](https://www.home-assistant.io/integrations/sensor.rest/) до вашого файлу `configuration.yaml`:

        resource: https://api.ipgeolocation.io/astronomy?lat=<LAT>&long=<LON>&apiKey=<API_KEY>
        name: ip_geo_location
        scan_interval: 300
        value_template: "OK"
        json_attributes:
          - moonrise
          - moonset
          - moon_altitude

  domain: automation

  input:
    awtrix:
      name: Пристрій AWTRIX
      description: Виберіть один або кілька пристроїв Awtrix (AWTRIX 3 та/або AWTRIX NG)
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
          multiple: true

    forecast_var:
      name: Погодинний прогноз (Hourly Forecast)
      description: "Виберіть сенсор, який надає погодинний прогноз (не денний)\nЦя інтеграція була протестована з:\n\n  - HACS інтеграцією [Weatherflow](https://github.com/briis/hass-weatherflow) \n  \n  - HomeAssistant [Openweather](https://www.home-assistant.io/integrations/openweathermap/)\n"
      selector:
        entity:
          filter:
            - domain: [weather]
          multiple: false
          reorder: false
      default: weather.forecast_home_assistant

    hours_to_show:
      name: Кількість годин прогнозу для показу
      description: 'Скільки годин прогнозу ви хочете показувати в нижній частині дисплея'
      selector:
        number:
          max: 24
          min: 0
          unit_of_measurement: Години
          mode: box
          step: 1
      default: 24

    temp_digits:
      name: Десяткові розряди температури після коми
      selector:
        number:
          min: 0
          max: 2
          step: 1
          mode: box
          unit_of_measurement: Десяткові розряди
      default: 1

    temp_suffix:
      name: Суфікс температури
      description: "Як ви хочете відображати температуру."
      selector:
        select:
          options:
            - {label: Немає, value: ""}
            - {label: "°", value: "°"}
            - {label: "°F", value: "°F"}
            - {label: "°C", value: "°C"}
            - {label: "F", value: "F"}
            - {label: "C", value: "C"}
          multiple: false
          custom_value: false
      default: "°"

    current_temp_var:
      name: Поточна температура надворі
      description: "Виберіть сенсор з метеостанції або прогнозу погоди, який надає поточну зовнішню температуру для відображення:\n\n  -  `sensor.openweathermap_feels_like_temperature`\n"
      selector:
        entity:
          filter:
            - domain: [sensor]
          multiple: false
          reorder: false
      default: sensor.openweathermap_temperature

    color_matrix_json:
      name: Колірна матриця
      description: "`Колірна матриця` керує тим, як кольори відповідають діапазонам температур на дисплеї. Формат цієї матриці — **JSON** \nТут ви можете ввести відповідність температури до кольору. \n> Зверніть увагу, що формат має бути *JSON*,\n        \n\nКілька можливих варіантів:\n#### ЄВРОПА: від -12°c до  -38°c на основі кольорів NOAA США \n\n    {\"-12\": \"#D977DF\",\"-6\": \"#9545BC\",\"-1\": \"#4B379C\",\"0\": \"#FEC4FF\",\"4\": \"#31B8DB\",\"10\": \"#31DB8B\",\"15\": \"#6ED228\",\"21\": \"#FFFF28\",\"27\": \"#F87E27\",\"32\": \"#CF3927\",\"38\": \"#A12527\"}\n\n\n#### США: Фаренгейт 0-100 (На основі шкали NOAA від 0-100)\n\n\n    {\"0\": \"#FEC4FF\",\"10\": \"#D977DF\",\"20\": \"#9545BC\",\"30\": \"#4B379C\",\"40\": \"#31B8DB\",\"50\": \"#31DB8B\",\"60\": \"#6ED228\",\"70\": \"#FFFF28\",\"80\": \"#F87E27\",\"90\": \"#CF3927\",\"100\": \"#A12527\"}\n"
      selector:
        text:
          multiline: true
          multiple: false
      default: |-
        {
          "-12": "#D977DF",
          "-6": "#9545BC",
          "-1": "#4B379C",
          "0": "#FEC4FF",
          "4": "#31B8DB",
          "10": "#31DB8B",
          "15": "#6ED228",
          "21": "#FFFF28",
          "27": "#F87E27",
          "32": "#CF3927",
          "38": "#A12527"
        }

    moon:
      name: Сенсор фази місяця (Moon Phase Sensor)
      description: "🌑️🌒️🌓️🌔️🌖️🌗️🌘️\nЩоб налаштувати сенсор місяця, дивіться тут: https://www.home-assistant.io/integrations/moon/\nабо просто [натисніть тут](https://my.home-assistant.io/redirect/config_flow_start?domain=moon)\n"
      selector:
        entity:
          multiple: false
          filter:
            - integration: moon
          reorder: false

    moon_rise_set:
      name: Сенсор сходу/заходу місяця (Moon Rise/Set)
      description: "Оскільки Home Assistant не надає час сходу/заходу місяця, вам потрібно буде отримати його з певного API. У моєму налаштуванні я використовую [ipgeolocation](https://app.ipgeolocation.io) як API.\nВи можете створити власний REST-сенсор таким чином:\n``` sensor: - platform: rest\n  resource: [https://api.ipgeolocation.io/astronomy?lat=](https://api.ipgeolocation.io/astronomy?lat=)<LAT>&long=<LON>&apiKey=<API_KEY>\n  name: ip_geo_location\n  scan_interval: 300\n  value_template: \"OK\"\n  json_attributes:\n    - moonrise\n    - moonset\n    - moon_altitude\n```\n"
      selector:
        entity:
          multiple: false
          filter:
            - integration: rest
          reorder: false

    when_show_moon:
      name: Коли слід відображати місяць
      description: "Деякі люди справді захоплюються місяцем 🐺️ і їх називають перевертнями, або, можливо, астрономами. \n\nБудь ласка, виберіть, як і коли ви хочете, щоб місяць відображався\n\nПри виборі `Завжди показувати місяць` (Always show moon) місяць завжди буде малюватись у правій частині дисплея. Інакше місяць буде малюватись лише тоді, коли він зійшов, залежно від вибраної опції.\n### ПРИМІТКА:\n\n  При значеннях яскравості менше 29 сірі кольори місяця можуть відтворюватись зеленим на годиннику.\n"
      selector:
        select:
          options:
            - {label: "Ніколи не показувати місяць", value: "never"}
            - {label: "Завжди показувати місяць", value: "always"}
            - {label: "Показувати місяць, лише якщо він зійшов", value: "risen"}
            - {label: "Показувати місяць, лише якщо він зійшов + ніч", value: "night"}
          multiple: false
          custom_value: false
      default: night

    use_moon_clear_night:
      name: Замінити іконку "Ясна ніч" на Місяць
      description: >
        За замовчуванням місяць малюється праворуч від годинника, однак, якщо увімкнути цю опцію, ви зможете замінити іконку `clear_night` (ясна ніч) на іконку місяця. Ця заміна іконки відбудеться лише в тому випадку, якщо місяць в цей момент має відображатися.

        - ![](https://developer.lametric.com/content/apps/icon_thumbs/2314_icon_thumb.png?v=1)
        - `full_moon`
        - ![](https://developer.lametric.com/content/apps/icon_thumbs/2315_icon_thumb.png?v=1)
        - `waning_gibbous`
        - ![](https://developer.lametric.com/content/apps/icon_thumbs/2316_icon_thumb.png?v=1)
        - `last_quarter`
        - ![](https://developer.lametric.com/content/apps/icon_thumbs/2317_icon_thumb.png?v=1)
        - `waning_crescent`
        - ![](https://developer.lametric.com/content/apps/icon_thumbs/2318_icon_thumb.png?v=1)
        - `new_moon`
        - ![](https://developer.lametric.com/content/apps/icon_thumbs/2319_icon_thumb.png?v=1)
        - `waxing_crescent`
        - ![](https://developer.lametric.com/content/apps/icon_thumbs/2320_icon_thumb.png?v=1)
        - `first_quarter`
        - ![](https://developer.lametric.com/content/apps/icon_thumbs/2321_icon_thumb.png?v=1)
        - `waxing_gibbous`
        Якщо ви хочете використовувати іншу іконку, будь ласка, введіть її текст у поле праворуч
      selector:
        boolean: {}
      default: true

    use_moon_sunny_night:
      name: Замінити "Сонячно + Ніч" на Місяць
      description: Деякі інтеграції погоди можуть некоректно обробляти стан `clear-night`. У такому разі ви можете використовувати цю опцію для автоматичної заміни на місяць, якщо у вас стан ніч + сонячно.
      selector:
        boolean: {}
      default: true

    show_sun_rise_set:
      name: "☀️ Показати Схід/Захід сонця"
      description: "Перед сходом та заходом сонця показувати повідомлення про майбутню зміну стану сонця.\n\n_Ви можете змінити іконки для сходу/заходу сонця набагато нижче._\n"
      selector:
        boolean: {}
      default: true

    sun_event_minute_threshold:
      name: "Сповіщення за (хв) 🕰️"
      selector:
        number:
          min: 5
          max: 1440
          unit_of_measurement: хв.
          step: 1
          mode: slider
      default: 59

    sun_time_type:
      name: Тип часу сонця
      description: "Під час показу сповіщення про схід/захід сонця можна використовувати 2 різні формати часу:\n\n  - Відносний час (Relative):  `12 min`\n  - Точний час (Actual):  `8:31 pm` або `22:31`\n"
      selector:
        select:
          options: 
            - {label: "Відносний", value: "Relative"}
            - {label: "Точний", value: "Actual"}
          multiple: false
          custom_value: false
      default: Actual

    sun_time_format:
      name: Формат точного часу
      description: "Якщо ви використовуєте точний час, тут можна ввести рядок у форматі STRFTIME для відображення часу. Деякі можливі варіанти:\n\n  - `%H:%M`, що виглядатиме як `05:29`\n  \n  - `%-I%M%p`, що виглядатиме як `529AM`\n  - `%-I:%M%p`, що виглядатиме як `5:29AM`\n\n\n\n  Детальніше дивіться на https://strftime.org/\n"
      selector:
        text:
          type: text
          multiple: false
          multiline: false
      default: "%H:%M"

    message_duration_forecast:
      name: Тривалість показу прогнозу ⏱️
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: сек.
          step: 1
          mode: slider
      default: 10

    message_duration_riseset:
      name: Тривалість показу сходу/заходу сонця ⏱️
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: сек.
          step: 1
          mode: slider
      default: 10

    icon_clear_night:
      name: Іконка для ясної ночі (clear-night)
      description: "
Стандартна іконка ясної ночі (clear_night): 

  ![](https://developer.lametric.com/content/apps/icon_thumbs/53383_icon_thumb.gif?v=2) - `53383`
"
      selector:
        text: {}
      default: w-clear-night

    icon_cloudy:
      name: Іконка для хмарності (cloudy)
      description: "Це ID іконки, яка відповідає стану погоди: `cloudy`

![](https://developer.lametric.com/content/apps/icon_thumbs/53384_icon_thumb.gif?v=1)
"
      selector:
        text: {}
      default: w-cloudy

    icon_exceptional:
      name: Іконка для exceptional
      description: "Це ID іконки, яка відповідає стану погоди: `exceptional`

![](https://developer.lametric.com/content/apps/icon_thumbs/36637_icon_thumb.gif?v=1)
